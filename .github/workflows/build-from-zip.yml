name: Build APK from zip
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          Z=$(find . -iname '*.zip' -not -path './proj/*' | head -1)
          echo "zip: $Z"
          if [ -z "$Z" ]; then echo "NO ZIP FOUND"; ls -R | head -40; exit 1; fi
          mkdir proj && unzip -q "$Z" -d proj
          S=$(find proj -name settings.gradle | head -1)
          if [ -z "$S" ]; then echo "settings.gradle not found in zip"; find proj | head -40; exit 1; fi
          echo "DIR=$(dirname "$S")" >> $GITHUB_ENV
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Download PDF libraries
        run: |
          mkdir -p $DIR/app/src/main/assets/libs && cd $DIR/app/src/main/assets/libs
          B=https://cdnjs.cloudflare.com/ajax/libs
          curl -fsSLO $B/pdf.js/3.11.174/pdf.min.js
          curl -fsSLO $B/pdf.js/3.11.174/pdf.worker.min.js
          curl -fsSLO $B/pdf-lib/1.17.1/pdf-lib.min.js
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
